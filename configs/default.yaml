# VideoAgent Default Configuration

generator:
  model_name: "stable-video-diffusion"
  num_frames: 25
  fps: 8
  resolution: [512, 512]
  guidance_scale: 7.5
  num_inference_steps: 25

visual_agent:
  model: "clip-vit-large-patch14"
  threshold: 0.7
  metrics: ["aesthetic", "quality", "coherence"]

audio_agent:
  model: "wav2vec2-base"
  sample_rate: 16000
  metrics: ["clarity", "sync", "quality"]

context_agent:
  model: "bert-large-uncased"
  similarity_threshold: 0.8
  metrics: ["relevance", "completeness"]

reasoning_agent:
  model: "gpt-3.5-turbo"
  max_tokens: 512
  temperature: 0.7
  refinement_strategy: "iterative"

tournament:
  size: 4
  evaluation_metrics: ["visual", "audio", "context"]
  weights: [0.4, 0.3, 0.3]

logging:
  level: "INFO"
  save_logs: true
  log_dir: "logs"
